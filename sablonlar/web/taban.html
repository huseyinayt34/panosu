<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block baslik %}Panosu{% endblock %}</title>
<link rel="stylesheet" href="/statik/panel.css">
{% block bas %}{% endblock %}
</head>
<body{% block govde_nitelikleri %}{% endblock %}>
<header class="ust">
  <a class="marka" href="/pano">Panosu</a>
  {% if isletme_adi %}<span class="isletme-adi">{{ isletme_adi }}</span>{% endif %}
  {% if oturum_acik %}
  <nav>
    {% if uyelik_sayisi and uyelik_sayisi > 1 %}<a href="/isletme">İşletme değiştir</a>{% endif %}
    <form method="post" action="/cikis" class="cikis">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit">Çıkış</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
{% block icerik %}{% if mesaj %}<p class="mesaj">{{ mesaj }}</p>{% endif %}{% endblock %}
</main>
</body>
</html>
