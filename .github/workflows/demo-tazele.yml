# Yayındaki demo veritabanını (Neon panosu_demo) her gece bugüne kaydırır (Adım 11, K23; docs/adim-11-tasarim.md).
# 00:00 UTC = 03:00 İstanbul. Kaçan gece ertesi gece d = 2 ile telafi edilir (K11).
name: Demo tazeleme

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-veritabani
  cancel-in-progress: false

jobs:
  tazele:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PANOSU_VERITABANI_URL: ${{ secrets.PANOSU_VERITABANI_URL }}
      PANOSU_MIGRASYON_URL: ${{ secrets.PANOSU_MIGRASYON_URL }}
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-uretim.txt

      - name: Bağımlılıklar
        run: pip install -r requirements-uretim.txt

      # Ayarlar doğrulaması PANOSU_JWT_GIZLI ister; tazeleme kullanmaz. Her çalıştırmada rastgele, maskeli.
      - name: Geçici JWT gizlisi
        run: |
          gizli="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$gizli"
          echo "PANOSU_JWT_GIZLI=$gizli" >> "$GITHUB_ENV"

      - name: Demo tazeleme
        run: python -m sentetik.demo_tazele --veritabani panosu_demo
