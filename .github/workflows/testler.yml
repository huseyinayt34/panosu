# Runs the full pytest suite on every push to main and on pull requests.
# Throwaway PostgreSQL service with trust auth: no password exists, so none is committed (CLAUDE.md rule 7).
# Same order as a local setup: alembic upgrade head with the admin role, then panosu_app is allowed to log in.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Same official image as Docker Hub (identical digest), pulled from the AWS mirror to avoid Docker Hub
        # rate limits on shared runners.
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: panosu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: Europe/Istanbul
      PANOSU_TEST_ADMIN_URL: postgresql+psycopg2://postgres@localhost:5432/panosu_test
      PANOSU_TEST_APP_URL: postgresql+psycopg2://panosu_app@localhost:5432/panosu_test
      PANOSU_MIGRASYON_URL: postgresql+psycopg2://postgres@localhost:5432/panosu_test
      PANOSU_VERITABANI_URL: postgresql+psycopg2://panosu_app@localhost:5432/panosu_test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-uretim.txt

      # Runtime deps plus the test-only packages (versions pinned as in requirements.txt).
      - name: Dependencies
        run: pip install -r requirements-uretim.txt pytest==9.1.1 httpx==0.28.1 openpyxl==3.1.5

      # Settings validation needs PANOSU_JWT_GIZLI; random per run and masked in logs.
      - name: Temporary JWT secret
        run: |
          gizli="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$gizli"
          echo "PANOSU_JWT_GIZLI=$gizli" >> "$GITHUB_ENV"

      - name: Schema (alembic upgrade head)
        run: alembic upgrade head

      # The baseline creates panosu_app as NOLOGIN; locally it gets LOGIN and a password by hand.
      - name: Allow panosu_app to log in
        run: |
          python - <<'EOF'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ["PANOSU_TEST_ADMIN_URL"]).begin() as con:
              con.execute(text("ALTER ROLE panosu_app LOGIN"))
          EOF

      - name: pytest
        run: python -m pytest -q

  # Firm-side image (Dockerfile.pilot): builds, and the score command runs with no network on a synthetic studio.
  pilot-imaji:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: docker build -t ritmeva-pilot -f Dockerfile.pilot .

      - name: Synthetic studio files (backtest S6 generator, inside the image)
        run: |
          mkdir -p ornek && chmod 777 ornek
          docker run --rm -i --network none -v "$PWD/ornek:/veri" --entrypoint python ritmeva-pilot - <<'EOF'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import numpy as np
          from backtest.senaryolar import GOZLEM_GUN, S6_GIRIS_SON_KULLANMA, S6_PAKETLER, uret_s6
          v = uret_s6(np.random.default_rng(1), 250)
          baz = datetime(2026, 9, 30, tzinfo=ZoneInfo("Europe/Istanbul")) - timedelta(days=GOZLEM_GUN)
          gun = lambda t: (baz + timedelta(days=float(t))).strftime("%d.%m.%Y")
          with open("paketler.csv", "w", encoding="utf-8-sig") as f:
              f.write("Üye No;Paket No;Paket Adı;Başlangıç Tarihi;Bitiş Tarihi;Seans Sayısı;Ücret;Durum\n")
              for j, pk in enumerate(v.paketler):
                  ad, tur, _, sure, hak, fiyat = S6_PAKETLER[pk.tur_no]
                  bitis = pk.baslangic + (sure if tur == "sure" else S6_GIRIS_SON_KULLANMA)
                  f.write(f"U{pk.uye:05d};K{j:06d};{ad};{gun(pk.baslangic)};{gun(bitis)};{hak or ''};{fiyat},00;\n")
          with open("girisler.csv", "w", encoding="utf-8-sig") as f:
              f.write("Üye No;Giriş Tarihi\n")
              for i, z in enumerate(v.zamanlar):
                  for t in z:
                      f.write(f"U{i:05d};{(baz + timedelta(days=float(t))).strftime('%d.%m.%Y %H:%M')}\n")
          EOF

      - name: Score and pilot commands without network
        run: |
          docker run --rm --network none -v "$PWD/ornek:/veri" ritmeva-pilot servisler.skor --kaynak ornek \
            --paketler paketler.csv --girisler girisler.csv --cikti skorlar.csv
          docker run --rm --network none -v "$PWD/ornek:/veri" ritmeva-pilot servisler.pilot_dogrula --kaynak ornek \
            --paketler paketler.csv --girisler girisler.csv
          test "$(wc -l < ornek/skorlar.csv)" -gt 1
          test -s ornek/raporlar/pilot/ornek/pilot-raporu.html
          cmp ornek/skorlar.csv ornek/raporlar/pilot/ornek/skorlar.csv
